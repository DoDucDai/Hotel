spring.application.name=hotelbooking
spring.config.import=optional:file:.env[.properties],optional:classpath:application-local.properties
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/hotelbooking}
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.backend-url=${APP_BACKEND_URL:http://localhost:8080}
app.mail.from=${APP_MAIL_FROM:${MAIL_USERNAME:no-reply@hotelbooking.local}}
app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.name=${APP_BOOTSTRAP_ADMIN_NAME:}
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.demo-seed.enabled=${APP_DEMO_SEED_ENABLED:false}
app.demo-seed.password=${APP_DEMO_SEED_PASSWORD:}
app.demo-seed.admin-name=${APP_DEMO_SEED_ADMIN_NAME:Demo Admin}
app.demo-seed.admin-email=${APP_DEMO_SEED_ADMIN_EMAIL:demo.admin@hotelbooking.local}
app.demo-seed.host-name=${APP_DEMO_SEED_HOST_NAME:Demo Host}
app.demo-seed.host-email=${APP_DEMO_SEED_HOST_EMAIL:demo.host@hotelbooking.local}
app.demo-seed.user-name=${APP_DEMO_SEED_USER_NAME:Demo User}
app.demo-seed.user-email=${APP_DEMO_SEED_USER_EMAIL:demo.user@hotelbooking.local}
payment.sandbox.secret=${PAYMENT_SANDBOX_SECRET:replace_me_with_a_long_sandbox_secret}
payment.manual.bank.provider=${PAYMENT_MANUAL_BANK_PROVIDER:MB Bank}
payment.manual.bank.account-name=${PAYMENT_MANUAL_BANK_ACCOUNT_NAME:HOTEL BOOKING}
payment.manual.bank.account-number=${PAYMENT_MANUAL_BANK_ACCOUNT_NUMBER:123456789}
payment.manual.wallet.provider=${PAYMENT_MANUAL_WALLET_PROVIDER:MoMo}
payment.manual.wallet.account-name=${PAYMENT_MANUAL_WALLET_ACCOUNT_NAME:HOTEL BOOKING}
payment.manual.wallet.account-number=${PAYMENT_MANUAL_WALLET_ACCOUNT_NUMBER:123456789}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:doducdai17042004@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Hotel Booking API
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-no-request-id}] %logger{36} - %msg%n
